# DynaPrompt Configuration
# Main hyperparameters for the dynamic prompt guidance system

model:
  name: "stable-diffusion-v1-5"
  checkpoint_path: "models/stable_diffusion_compvis/v1-5-pruned-emaonly.ckpt"
  config_path: "models/stable_diffusion_compvis/configs/stable-diffusion/v1-inference.yaml"

sampling:
  ddim_steps: 50
  ddim_eta: 0.0
  sampler: "ddim"  # Options: ddim, plms
  scale: 7.5  # Classifier-free guidance scale
  H: 512  # Image height
  W: 512  # Image width
  C: 4    # Latent channels
  f: 8    # Downsampling factor

feedback:
  enabled: true
  clip_model: "openai/clip-vit-base-patch32"  # Use base model for stability
  feedback_frequency: 2  # More frequent feedback (every 2 steps)
  feedback_start_step: 0  # Start immediately
  feedback_end_step: 50    # Continue throughout

prompt_update:
  update_alpha: 0.25  # Much stronger learning rate for aggressive feedback
  update_method: "weighted"  # Options: weighted, additive, multiplicative
  token_threshold: 0.5  # Minimum similarity threshold to trigger update
  normalize: true  # Normalize embeddings after update

# Hybrid configuration (combines zk2295 + ch3889)
clip:
  model_name: "openai/clip-vit-base-patch32"  # CLIP model for embedding feedback

attention:
  boost_factor: 3.0  # Very strong attention amplification
  threshold: 0.05     # Attention threshold for weak token detection
  start_step: 0       # Start attention boosting immediately
  end_step: 50        # Continue throughout generation

# Adaptive reweighting configuration
adaptive_reweighting:
  enabled: true       # Enable adaptive weight adjustment
  momentum: 0.7       # Lower momentum for faster adaptation
  adaptation_rate: 0.15  # More aggressive adaptation
  min_alpha: 0.10     # Higher minimum alpha
  max_alpha: 0.5      # Higher maximum alpha
  min_boost: 1.5      # Higher minimum boost
  max_boost: 3.0      # Higher maximum boost

clip_feedback:
  per_token_similarity: true  # Compute similarity per token
  use_attention_pooling: false  # Use attention-based pooling
  temperature: 0.07  # Temperature for CLIP similarity

logging:
  save_intermediate_images: true
  save_frequency: 10  # Save every N steps
  log_similarities: true
  verbose: true

output:
  output_dir: "data/images/generated/dynaprompt"
  save_format: "png"
  save_metadata: true
